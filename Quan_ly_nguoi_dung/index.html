<!DOCTYPE html>
<html lang="vi">
    <head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quản lý người dùng</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>Áo Dài Việt - Quản lý người dùng</h1>
    <a href="../Trang_chu/index.html">← Quay về trang chủ</a>
</header>
<main>
    <h2>Quản lý người dùng</h2>
    <section class="panel">
        <h3 id="formTitle">Thêm người dùng</h3>
        <form id="userForm">
            <input type="hidden" id="userId">
            <label>
                Họ và tên<input id="fullName" required>
            </label>
            <label>
                Tên đăng nhập<input id="username" required>
            </label>
            <label>
                Email<input id="email" type="email" required>
            </label>
            <label>
                Mật khẩu<input id="password" type="password" placeholder="Để trống nếu không đổi mật khẩu">
            </label>
            <label>
                Vai trò
                <select id="role">
                    <option>Khách hàng</option>
                    <option>Quản trị viên</option>
                </select>
            </label>
            <div class="buttons">
                <button type="submit" id="saveButton">Thêm tài khoản</button>
                <button type="button" id="resetButton" class="secondary">Làm mới</button>
            </div>
            <p id="message"></p>
        </form>
    </section>
    <section class="panel">
        <h3>Danh sách người dùng</h3>
        <input id="search" type="search" placeholder="Tìm theo họ tên, tên đăng nhập hoặc email...">
        <div class="table-wrap">
            <table>
                <thead>
                    <tr>
                        <th>STT</th>
                        <th>Họ và tên</th>
                        <th>Tên đăng nhập</th>
                        <th>Email</th>
                        <th>Vai trò</th>
                        <th>Thao tác</th>
                    </tr>
                </thead>
                <tbody id="rows"></tbody>
            </table>
        </div>
    </section>
</main>
    <script src="script.js"></script>
    </body>
</html>
