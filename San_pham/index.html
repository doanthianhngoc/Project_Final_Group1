<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sản phẩm - Áo Dài Việt</title>
    <link rel="stylesheet" href="../Dung_chung/thanh-dieu-huong.css">
    <!-- Bootstrap CSS -->
     <link rel="stylesheet" href="../Dung_chung/tai-khoan.css">
    <link rel="stylesheet"
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.3.1.slim.min.js"></script>

    <!-- Popper.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.14.7/umd/popper.min.js"></script>

    <!-- Bootstrap JavaScript -->
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js"></script>
</head>
<body onload="san_pham()">
    <!-- Phần thanh điều hướng -->
        <div class="thanh_dieu_huong">
            <div class="anh">
                <img src="../img/logo_hoa_sen.png" alt="">
                <div class="text">
                    <h1><i>Áo Dài Việt</i></h1>
                    <p><i>Tôn vinh nét đẹp Việt</i></p>
                </div>
            </div>
            <nav class="menu"> 
                
                <li><a href="../Trang_chu/index.html">Trang chủ</a></li>
                <li><a href="../Gioi_thieu/index.html">Giới thiệu</a></li>
                <li><a href="../San_pham/index.html">Sản phẩm</a></li>
                <li><a href="../Lien_he/index.html">Liên hệ</a></li>
            </nav>
            <div class="icon">
                <a href="../Tim_kiem_san_pham/index.html" class="icon">
                    <i class="fa-solid fa-magnifying-glass"></i>
                </a>
                <div id="taiKhoanContainer"></div>
                <a href="../Gio_hang/index.html" class="icon">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span class="cart-badge"></span>
                </a>
            </div>
        </div>

        <!-- Phần tiêu đề của trang -->
        <div class="image">
            <img src="../img/anh1.png" alt="">
            <h1>Sản phẩm</h1>
            <p>Khám phá bộ sưu tập áo dài đa dạng phù hợp với mọi phong cách</p>
        </div>

        <!-- Danh mục sản phẩm -->

        <main class="container-fluid">
            <aside class="tat_ca_danh_muc">
            <div class="danh_muc">
                <h2>Danh mục</h2>
                <label><input type="radio" name="category" value="all" checked> Tất cả sản phẩm</label>
                <label><input type="radio" name="category" value="truyen-thong"> Áo dài truyền thống</label>
                <label><input type="radio" name="category" value="cach-tan"> Áo dài cách tân</label>
                <label><input type="radio" name="category" value="gam"> Áo dài gấm</label>
                <label><input type="radio" name="category" value="lua"> Áo dài lụa</label>
            </div>


            <div class="gia">
                <h2>Khoảng giá</h2>
                <label><input type="radio" name="price" value="all" checked> Tất cả mức giá</label>
                <label><input type="radio" name="price" value="under300"> Dưới 300.000đ</label>
                <label><input type="radio" name="price" value="300-500"> 300.000đ - 500.000đ</label>
                <label><input type="radio" name="price" value="500-700"> 500.000đ - 700.000đ</label>
                <label><input type="radio" name="price" value="over700"> Trên 700.000đ</label></div>
                <button class="btn-loc" onclick="locSanPham()">Lọc sản phẩm</button>
                <button class="btn-reset" onclick="boLoc()">Bỏ lọc</button>
            </aside>


            <section class="san_pham">
                <p id="thongBaoLoc"></p>


            <div class="row" id="aodai">
            
            </div>


            <div class="pagination" id="phanTrang">


            </div>


            </section>
        </main>

    <!-- Hộp thoại chi tiết sản phẩm -->
        <div id="hopThoaiChiTiet"
            class="chi-tiet-overlay"
            onclick="dongChiTietNeuBamNen(event)">

            <div class="chi-tiet-noi-dung">

                <!-- Nút đóng -->
                <button type="button"
                        class="chi-tiet-dong"
                        onclick="dongChiTiet()"
                        aria-label="Đóng">
                    &times;
                </button>

                <!-- Nội dung chi tiết sản phẩm sẽ được JavaScript hiển thị -->
                <div id="noiDungChiTiet"></div>

            </div>
        </div>

    <script src="script.js"></script>
    <script src="../Dung_chung/tai-khoan.js"></script>
</body>

</html>
